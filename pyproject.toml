[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-pipeline"
version = "0.1.0"
description = "Unstructured-to-structured document extraction pipeline (vendor invoices)"
requires-python = ">=3.11"
dependencies = [
    "reportlab>=4.0",
    "faker>=24.0",
    "pillow>=10.0",
    "pillow-heif>=0.16",  # iPhone HEIC photos
    "numpy>=1.26",
    "pymupdf>=1.24",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "anthropic>=1.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # required by fastapi.testclient.TestClient
]

[tool.setuptools.packages.find]
where = ["src"]
